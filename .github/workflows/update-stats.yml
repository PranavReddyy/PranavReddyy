name: Update GitHub Stats

on:
  schedule:
    # Avoid the top-of-the-hour backlog that can delay scheduled workflows.
    - cron: "17 3 * * *"
  workflow_dispatch: # Allows manual trigger

# Explicit permissions are required when the workflow commits the refreshed SVGs
# back to the repository. `github.token` is short-lived, so it does not need a
# separately maintained personal access token.
permissions:
  contents: write

# Never let two scheduled/manual runs race while updating the cache and SVGs.
concurrency:
  group: update-github-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests python-dateutil lxml

      - name: Run stats script
        env:
          # The built-in token remains valid for the entire run and can read
          # public profile data while also pushing this repository's update.
          ACCESS_TOKEN: ${{ github.token }}
          USER_NAME: ${{ github.repository_owner }}
        run: python github_stats.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --staged --quiet; then
            echo "Stats are already up to date."
          else
            git commit -m "Update GitHub stats"
            git push
          fi
